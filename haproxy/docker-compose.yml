services:
  haproxy:
    image: haproxy:3.1-alpine
    container_name: haproxy-ollama-proxy
    restart: unless-stopped
    # Explicitly map port to localhost only (prevents external access)
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro