global
    maxconn 256

defaults
    mode http
    timeout connect 30s
    timeout client 120s
    timeout server 120s

frontend ollama_frontend
    bind 0.0.0.0:11434
    mode http
    default_backend ollama_backend

backend ollama_backend
    mode http
    timeout server 120s
    server ollama-local host.docker.internal:32000

